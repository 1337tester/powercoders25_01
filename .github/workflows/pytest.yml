name: Pytest Pipeline

on:
  push:
    branches: [ masta ]
  pull_request:
    branches: [ masta ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Run pytest
      run: |
        pytest -v
